name: All platforms build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain, x64>
      # 2. <Windows, Release, latest MSVC compiler toolchain, ARM64>
      # 3. <Linux, Release, latest GCC compiler toolchain, x64>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        platform: [windows-x64, windows-arm64, ubuntu-x64]
        include:
          - platform: windows-x64
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            arch: x64
            build_type: Release
          - platform: windows-arm64
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            arch: ARM64
            build_type: Release
          - platform: ubuntu-x64
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            arch: x64
            build_type: Release

    steps:
    - uses: actions/checkout@v7

    - name: Install Perl and NASM on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: choco install strawberryperl nasm -y --no-progress

    - name: Install Perl and NASM on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y perl nasm

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.2.0"  # use most recent 4.2.x version

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. Use -A for Visual Studio architecture selection.
      shell: bash
      run: |
        jpeg_repository_arg=""
        if [ "${{ matrix.os }}" = "windows-latest" ] && [ "${{ matrix.arch }}" = "ARM64" ]; then
          jpeg_repository_arg="-DJPEG_REPOSITORY=IJG"
        fi

        arch_arg=""
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          arch_arg="-A ${{ matrix.arch }}"
        fi

        cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
          $arch_arg \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} \
          -S "${{ github.workspace }}" \
          -DFREEIMAGE_BUILD_TESTS:BOOL=ON \
          $jpeg_repository_arg

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Package
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target package

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: package-${{ matrix.platform }}
        path: ${{ steps.strings.outputs.build-output-dir }}/FreeImageRe-*.zip
        if-no-files-found: error

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # run: ctest --build-config ${{ matrix.build_type }}
      run: echo "Tests are skipped"

  build-android:
    name: Build android-arm64-v8a
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865

    steps:
    - uses: actions/checkout@v7

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

    - name: Cache Android dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/dependencies
          ${{ github.workspace }}/build-android-release/dependencies
        key: ${{ runner.os }}-android-${{ env.ANDROID_NDK_VERSION }}-arm64-v8a-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake') }}

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.2.0"

    - name: Configure CMake
      shell: bash
      run: cmake --preset android-release-unix

    - name: Build and package
      working-directory: ${{ github.workspace }}/build-android-release
      run: cmake --build . -t package

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: package-android-arm64-v8a
        path: ${{ github.workspace }}/build-android-release/FreeImageRe-*.zip
        if-no-files-found: error

  update-draft-release:
    name: Update draft release
    needs:
      - build
      - build-android
    if: |
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t drafts < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == true) | .tag_name'
          )

          if (( ${#drafts[@]} > 1 )); then
            echo "More than one draft release exists; refusing to choose one automatically." >&2
            exit 1
          fi

          if (( ${#drafts[@]} == 0 )); then
            short_sha="${GITHUB_SHA:0:7}"
            tag="build-master-${short_sha}"
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "FreeImageRe build ${short_sha}" \
              --notes "Automated draft build from master."
          else
            tag="${drafts[0]}"
          fi

          shopt -s nullglob
          assets=(release-assets/FreeImageRe-*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "No FreeImageRe ZIP packages were downloaded." >&2
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
